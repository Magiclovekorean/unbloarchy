# Plymouth draws the disk password prompt and the boot splash, as on x86
# Unbloarchy. It goes right after systemd so its initrd units order correctly,
# only when the hook is installed, and never twice.
if [[ -f /usr/lib/initcpio/install/plymouth && " ${HOOKS[*]} " != *" plymouth "* ]]; then
  _unbloarchy_mac_plymouth_hooks=()
  _unbloarchy_mac_plymouth_added=false
  for _unbloarchy_mac_plymouth_hook in "${HOOKS[@]}"; do
    _unbloarchy_mac_plymouth_hooks+=("$_unbloarchy_mac_plymouth_hook")
    if [[ $_unbloarchy_mac_plymouth_hook == systemd && $_unbloarchy_mac_plymouth_added == false ]]; then
      _unbloarchy_mac_plymouth_hooks+=(plymouth)
      _unbloarchy_mac_plymouth_added=true
    fi
  done
  if [[ $_unbloarchy_mac_plymouth_added == true ]]; then
    HOOKS=("${_unbloarchy_mac_plymouth_hooks[@]}")
  fi
  unset _unbloarchy_mac_plymouth_hooks _unbloarchy_mac_plymouth_added _unbloarchy_mac_plymouth_hook
fi
