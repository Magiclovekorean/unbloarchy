# Insert unbloarchy-mac-encrypt after vendorfw/block and sd-encrypt immediately
# before filesystems, each only if that hook is absent. 90-unbloarchy-mac.conf
# already put asahi and unbloarchy-vendorfw before filesystems; this drop-in is
# sourced after it.
#
# Both are systemd initrd units: the systemd hook replaces udev (mkinitcpio's
# stock HOOKS line) and keymap/consolefont become sd-vconsole. A HOOKS line
# carrying the busybox encrypt hook belongs to a Mac unlocked by cryptdevice=,
# which sd-encrypt cannot parse: that line is left exactly as it is.
_unbloarchy_mac_encrypt_hooks=()
_unbloarchy_mac_encrypt_have_systemd=false
_unbloarchy_mac_encrypt_have_vconsole=false
_unbloarchy_mac_encrypt_have_encrypt=false
for _unbloarchy_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_unbloarchy_mac_encrypt_hook in
    systemd) _unbloarchy_mac_encrypt_have_systemd=true ;;
    sd-vconsole) _unbloarchy_mac_encrypt_have_vconsole=true ;;
    encrypt) _unbloarchy_mac_encrypt_have_encrypt=true ;;
  esac
done
if [[ $_unbloarchy_mac_encrypt_have_encrypt == false ]]; then
for _unbloarchy_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_unbloarchy_mac_encrypt_hook in
    udev)
      if [[ $_unbloarchy_mac_encrypt_have_systemd == false ]]; then
        _unbloarchy_mac_encrypt_hooks+=(systemd)
        _unbloarchy_mac_encrypt_have_systemd=true
      fi
      ;;
    keymap|consolefont)
      if [[ $_unbloarchy_mac_encrypt_have_vconsole == false ]]; then
        _unbloarchy_mac_encrypt_hooks+=(sd-vconsole)
        _unbloarchy_mac_encrypt_have_vconsole=true
      fi
      ;;
    *) _unbloarchy_mac_encrypt_hooks+=("$_unbloarchy_mac_encrypt_hook") ;;
  esac
done
if [[ $_unbloarchy_mac_encrypt_have_systemd == false ]]; then
  if [[ ${_unbloarchy_mac_encrypt_hooks[0]:-} == base ]]; then
    _unbloarchy_mac_encrypt_hooks=(base systemd "${_unbloarchy_mac_encrypt_hooks[@]:1}")
  else
    _unbloarchy_mac_encrypt_hooks=(systemd "${_unbloarchy_mac_encrypt_hooks[@]}")
  fi
fi
HOOKS=("${_unbloarchy_mac_encrypt_hooks[@]}")
_unbloarchy_mac_encrypt_hooks=()
_unbloarchy_mac_encrypt_have_ours=false
_unbloarchy_mac_encrypt_have_sd=false
_unbloarchy_mac_encrypt_added_ours=false
_unbloarchy_mac_encrypt_added_sd=false
for _unbloarchy_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_unbloarchy_mac_encrypt_hook == unbloarchy-mac-encrypt ]]; then
    _unbloarchy_mac_encrypt_have_ours=true
  fi
  if [[ $_unbloarchy_mac_encrypt_hook == sd-encrypt ]]; then
    _unbloarchy_mac_encrypt_have_sd=true
  fi
done
for _unbloarchy_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_unbloarchy_mac_encrypt_hook == sd-encrypt && $_unbloarchy_mac_encrypt_have_ours == false &&
        $_unbloarchy_mac_encrypt_added_ours == false ]]; then
    _unbloarchy_mac_encrypt_hooks+=(unbloarchy-mac-encrypt)
    _unbloarchy_mac_encrypt_added_ours=true
  fi
  if [[ $_unbloarchy_mac_encrypt_hook == filesystems ]]; then
    if [[ $_unbloarchy_mac_encrypt_have_ours == false && $_unbloarchy_mac_encrypt_added_ours == false ]]; then
      _unbloarchy_mac_encrypt_hooks+=(unbloarchy-mac-encrypt)
      _unbloarchy_mac_encrypt_added_ours=true
    fi
    if [[ $_unbloarchy_mac_encrypt_have_sd == false && $_unbloarchy_mac_encrypt_added_sd == false ]]; then
      _unbloarchy_mac_encrypt_hooks+=(sd-encrypt)
      _unbloarchy_mac_encrypt_added_sd=true
    fi
  fi
  _unbloarchy_mac_encrypt_hooks+=("$_unbloarchy_mac_encrypt_hook")
done
if [[ $_unbloarchy_mac_encrypt_have_ours == false && $_unbloarchy_mac_encrypt_added_ours == false ]]; then
  _unbloarchy_mac_encrypt_hooks+=(unbloarchy-mac-encrypt)
fi
if [[ $_unbloarchy_mac_encrypt_have_sd == false && $_unbloarchy_mac_encrypt_added_sd == false ]]; then
  _unbloarchy_mac_encrypt_hooks+=(sd-encrypt)
fi
HOOKS=("${_unbloarchy_mac_encrypt_hooks[@]}")
fi
unset _unbloarchy_mac_encrypt_hooks _unbloarchy_mac_encrypt_hook \
  _unbloarchy_mac_encrypt_have_ours _unbloarchy_mac_encrypt_have_sd \
  _unbloarchy_mac_encrypt_added_ours _unbloarchy_mac_encrypt_added_sd \
  _unbloarchy_mac_encrypt_have_systemd _unbloarchy_mac_encrypt_have_vconsole \
  _unbloarchy_mac_encrypt_have_encrypt
